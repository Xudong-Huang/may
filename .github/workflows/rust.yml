name: CI

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lints:
    name: Run cargo fmt and cargo clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2
      - name: Install toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy
      - name: cargo fmt --check
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check
      - name: Run cargo clippy
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: -- -D warnings
      - name: Run cargo clippy no default features
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --no-default-features -- -D warnings
      - name: Run cargo clippy epoll backend
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --no-default-features --features "io_cancel io_timeout work_steal" -- -D warnings
  io_uring:
    name: io_uring backend (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2
      - name: Install toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      # The tests skip themselves when the runner blocks io_uring_setup, so
      # this job stays green on hosted runners without io_uring access.
      - name: Run io_uring tests
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --features io_uring --test io_uring --test io_uring_stress -- --test-threads=1
      - name: Run cargo clippy io_uring minimal
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --no-default-features --features "io_uring io_cancel io_timeout work_steal" -- -D warnings
  test:
    name: Test ${{ matrix.rust }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        rust:
          - stable
          - nightly
        os:
          - ubuntu-latest
          - windows-latest
          - macOS-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2
      - name: Install Rust (${{ matrix.rust }})
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true
      - name: Run cargo test
        uses: actions-rs/cargo@v1
        with:
          command: test
          # Hosted runners may block io_uring; the general matrix exercises the
          # epoll/kqueue/IOCP backends. The dedicated io_uring job above runs
          # the completion-backend tests (and skips when the ring is blocked).
          args: --no-default-features --features "io_cancel io_timeout work_steal"
      - name: Run cargo release test
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --release --no-default-features --features "io_cancel io_timeout work_steal"
